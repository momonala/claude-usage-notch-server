[project]
name = "claude-usage-notch-server"
version = "0.1.0"
description = "Stores Claude Code usage records pushed from the notch app and serves them back for charting."
authors = [{name = "Mohit Nalavadi"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
    "coverage>=7.13.5",
    "vulture>=2.16",
    "spyglass",
    "apscheduler>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.config]
flask_port = 5014
flask_host = "127.0.0.1"
db_path = "data/claude-usage.db"
spyglass_host = "localhost:5013"
spyglass_dashboard_url = "https://spyglass.mnalavadi.org/dashboard/claude-usage-notch-server"
report_work_paths = ["/code/rev-ops", "/code/market-data", "/code/ingestion", "/code/analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
config = "src.config:main"
app = "src.app:main"
backfill = "src.backfill:main"
weekly-report = "src.weekly_report:main"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.uv.sources]
spyglass = { git = "https://github.com/momonala/spyglass.git", rev = "main" }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
